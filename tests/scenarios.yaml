# Render test scenarios. One golden image per entry, in tests/golden/<name>.png.
#
# EVERY FIELD HERE EXISTS TO MAKE THE OUTPUT REPRODUCIBLE. Frame counts are
# fixed rather than time- or convergence-based, the scene camera is always used
# (the editor camera starts at the origin looking at empty sky), and vSync is
# forced off, so the same commit produces the same bytes on any machine fast
# enough to finish.
#
# Resolution is deliberately small: these are regression images, not wallpapers,
# and they live in git.
#
#   name           output/golden filename stem
#   project        path to a .lrproj, relative to the repo root
#   shader         pathtracing | pbr | phong
#   frames         how many frames to render before reading back
#   accumulate     path tracer only -- with `frames`, sets the sample count
#   debugMode      0 = shaded, 1 = AABB heatmap, 2 = triangle heatmap

scenarios:
  # The reference renderer. 32 accumulated frames x 2 spp is enough for the
  # noise floor to settle below the comparison tolerance without the run taking
  # long enough to be annoying.
  - name: bunny-pathtracing
    project: TestProject/TestProject.lrproj
    shader: pathtracing
    width: 640
    height: 360
    raysPerPixel: 2
    bouncesPerRay: 4
    accumulate: true
    frames: 32

  # Single-sample, no accumulation: catches material and texture regressions
  # without any noise at all, so a failure here is unambiguous.
  - name: bunny-phong
    project: TestProject/TestProject.lrproj
    shader: phong
    width: 640
    height: 360
    frames: 4

  - name: bunny-pbr
    project: TestProject/TestProject.lrproj
    shader: pbr
    width: 640
    height: 360
    frames: 4

  # Geometry and BVH coverage, independent of shading: if the mesh format or the
  # accelerator regresses, this moves even when the shaded images do not.
  - name: bunny-aabb-heatmap
    project: TestProject/TestProject.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 1
    frames: 2

  - name: bunny-tri-heatmap
    project: TestProject/TestProject.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 2
    frames: 2

  # NUMERIC BSDF VALIDATION, not a picture. Ignores the scene entirely and
  # writes a table of directional albedos: x is roughness, y is view angle,
  # R = metal, G = dielectric. `energyTest` runs the white-furnace assertions on
  # the FLOAT output before the image is quantised, because an 8-bit encode
  # clamps at 1.0 and would hide the one failure that actually matters.
  #
  # frames: 1 -- the shader is a closed-form integration, not an accumulation.
  - name: bsdf-furnace
    project: TestProject/TestProject.lrproj
    shader: furnace
    width: 128
    height: 64
    frames: 1
    energyTest: true

  # ---- Primitive-only fixtures (generated by X3FixtureGen --fixture) --------
  # These depend on NOTHING in SampleModels, so they work on any checkout. They
  # are the per-pass gates Phase 7 gets validated against, and a gate that needs
  # an asset someone forgot to fetch is not a gate.
  #
  # Regenerate with:
  #   ./build/debug/Debug/X3FixtureGen --fixture materials --out tests/scenes/materials --force
  #   ./build/debug/Debug/X3FixtureGen --fixture lights    --out tests/scenes/lights    --force

  # 5x5 sphere grid: metal / dielectric / clearcoat / sheen / anisotropy, each
  # row sweeping its parameter. Rows are separated so a regression in one lobe
  # moves one row and leaves the others alone -- which is what makes the diff
  # diagnostic rather than merely red.
  - name: materials-pathtracing
    project: tests/scenes/materials/materials.lrproj
    shader: pathtracing
    width: 640
    height: 360
    raysPerPixel: 2
    bouncesPerRay: 3
    accumulate: true
    frames: 24

  - name: materials-pbr
    project: tests/scenes/materials/materials.lrproj
    shader: pbr
    width: 640
    height: 360
    frames: 4

  # One object per light type, spatially separated, each with its own shadow.
  # Phase 8 replaces the shadow path entirely; this is what will say whether the
  # replacement agrees with the tracer.
  - name: lights-pathtracing
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    raysPerPixel: 2
    bouncesPerRay: 3
    accumulate: true
    frames: 24

  - name: lights-pbr
    project: tests/scenes/lights/lights.lrproj
    shader: pbr
    width: 640
    height: 360
    frames: 4

  # THE DEPTH PREPASS'S OUTPUT -- the gate on Phase 7's rasterizer.
  #
  # Reverse-Z shown logarithmically: bright is near, black is the far plane and
  # empty sky. The raw value is useless to look at -- an object eight units away
  # sits at near/8 = 0.006, one or two levels out of 255, which reads as a black
  # frame and is indistinguishable from a prepass that drew nothing.
  #
  # THIS AND lights-pathtracing FRAME THE SAME SCENE, which is what makes the
  # rasterizer checkable against the reference rather than against an opinion.
  # When the golden was recorded, the ground horizon landed on row 120 in both
  # and the cube's silhouette edges on columns 267 and 371 in both. If this ever
  # goes red, compare the two directly before changing anything.
  - name: depth-prepass
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 3
    frames: 2

  # ---- Clustered Forward+ light culling (Phase 7b) --------------------------

  # LIGHTS PER CLUSTER, as a heatmap over the primary hit. A performance view,
  # not a correctness one: it says how much work the forward pass will do per
  # pixel, and it moves if the grid shape or the depth slicing changes.
  - name: cluster-heatmap
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 4
    frames: 2

  # CULLING CORRECTNESS, and this one is an assertion rather than a picture.
  #
  # For every visible point it asks: does this point's cluster list contain every
  # light that actually reaches it, under the SAME predicate SampleLightDirect
  # uses? Green yes, RED NO, blue for a visible surface that maps to no cluster.
  #
  # ANY RED IS A BUG. The golden contains none, so a regression that starts
  # dropping lights fails here loudly instead of showing up later as geometry
  # that is merely a bit too dark -- which is what a light-culling bug looks like
  # and is close to impossible to spot by eye.
  #
  # Over-inclusion is deliberately NOT an error: the cluster test is a sphere, so
  # a spot light whose cone misses the point is still listed. That costs a little
  # work and cannot change the image.
  - name: cluster-correctness
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 5
    frames: 2

  # ---- Clustered forward shading (Phase 7c) --------------------------------

  # THE RASTERIZER, SHADING. Depth prepass -> cluster build -> light cull ->
  # skybox fill -> forward opaque, with the compute path skipped entirely.
  #
  # ITS GATE IS lights-pbr, NOT ITS OWN GOLDEN. Both are single-sample direct
  # lighting plus the same ambient term over the same scene, and since Phase 6
  # both evaluate the same Bsdf.slang lobes and the same SampleLightDirect. The
  # only thing the forward pass does differently is take its light list from the
  # fragment's cluster instead of iterating every light -- so a disagreement
  # between these two images is a light-culling bug and very little else.
  #
  # That comparison is why SkyboxFill exists: without a background the two could
  # only be compared over a geometry mask, which is a weaker test.
  - name: forward-lights
    project: tests/scenes/lights/lights.lrproj
    shader: forward
    width: 640
    height: 360
    frames: 4

  - name: forward-materials
    project: tests/scenes/materials/materials.lrproj
    shader: forward
    width: 640
    height: 360
    frames: 4

  # ---- Velocity buffer (Phase 7d) ------------------------------------------

  # SCREEN-SPACE MOTION VECTORS, under actual motion.
  #
  # cameraPanX moves the scene camera a fixed step along world X between frames,
  # which is the only reason this test says anything. Every other scenario is a
  # static scene viewed by a static camera, and correct motion vectors for that
  # are identically zero -- a golden recorded that way passes whether the pass
  # computes motion or writes nothing at all.
  #
  # Red is rightward motion, green downward, mid-grey no motion. Amplified 20x
  # because velocity is in UV units: a whole pixel of motion at 640 wide is
  # 0.0016, which shown raw is a black frame and indistinguishable from a pass
  # that never ran. That is the same trap the depth view fell into.
  #
  # The sky has no geometry and therefore no velocity, so it stays exactly at
  # the clear value. That is correct and deliberate: camera-only reprojection
  # from depth is Phase 11's problem, and a velocity buffer that guessed at it
  # here would be wrong for anything that moved on its own.
  - name: velocity-pan
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 6
    frames: 4
    cameraPanX: 0.25

  # The same pass with the camera STATIONARY. Correct output is a flat mid-grey
  # everywhere geometry is: zero motion, biased to 0.5. It is a weaker test than
  # the pan above and it catches a different failure -- a velocity buffer that
  # reports motion for a scene that is not moving, which is what a stale or
  # wrongly-indexed PrevTransformBuffer produces and what TAA smears worst.
  - name: velocity-static
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 6
    frames: 4

  # ---- Transparency (Phase 7e) ---------------------------------------------

  # THE REFERENCE for transparency: the path tracer with alpha as COVERAGE.
  # With probability 1-alpha a ray passes straight through, which converges to
  # exactly what back-to-front alpha blending produces -- and needs no sorting,
  # which is precisely why it is the right thing to define the answer.
  #
  # The panes overlap in depth on purpose. A single layer of transparency looks
  # correct under almost any ordering, so a fixture without overlap tests the
  # blend factor and nothing about the sorting.
  #
  # 48 frames because coverage is now stochastic: a surface at alpha 0.5 is a
  # coin flip per sample, and that noise settles more slowly than the shading
  # noise the other path-traced scenarios budget for.
  - name: transparency-pathtracing
    project: tests/scenes/transparency/transparency.lrproj
    shader: pathtracing
    width: 640
    height: 360
    raysPerPixel: 2
    bouncesPerRay: 3
    accumulate: true
    frames: 48
    # LINEAR, like every other path-traced golden. It briefly carried
    # `tonemap: true` so it could be compared to transparency-forward directly;
    # that stopped being tenable when the tonemap became AgX, because matching it
    # would have meant a second AgX implementation in C++ inside the harness --
    # the exact duplication ToneMapping.slang exists to prevent.
    #
    # transparency-pbr is the comparable reference and always was the better one:
    # it is single-bounce like the rasterizer, where this carries full GI. This
    # scenario's job is to say the compositing MODEL is right, which it does in
    # any colour space.

  # THE LIKE-FOR-LIKE REFERENCE for the transparent raster pass.
  #
  # PBR.slang composites transparency ANALYTICALLY, front to back, and front-to
  # -back `C += T*a*c; T *= 1-a` is algebraically identical to the back-to-front
  # `a*src + (1-a)*dst` the transparent pipeline blends with. No noise, no sample
  # count, and single-bounce like the rasterizer.
  #
  # The path-traced version above is a SECOND, INDEPENDENT check: it models alpha
  # as stochastic coverage and needs no ordering at all, so it says whether the
  # compositing model is right. It carries full GI, so it cannot be compared to a
  # single-bounce rasterizer pixel for pixel -- which is the same reason
  # forward-lights is gated against lights-pbr and not lights-pathtracing.
  - name: transparency-pbr
    project: tests/scenes/transparency/transparency.lrproj
    shader: pbr
    width: 640
    height: 360
    frames: 4

  # THE RASTER SIDE, gated against transparency-pbr above rather than
  # against a golden of itself. That is the whole reason the reference got
  # alpha-as-coverage first: coverage needs no ordering, so if the raster pass
  # sorts wrongly the two disagree and this test is what says so.
  - name: transparency-forward
    project: tests/scenes/transparency/transparency.lrproj
    shader: forward
    width: 640
    height: 360
    frames: 4

  # ---- Cascaded shadow maps (Phase 8) ---------------------------------------

  # WHICH CASCADE each surface samples, darkened where the cascaded lookup says
  # shadowed. Red / green / blue / yellow for cascades 0-3, grey beyond the last
  # one, black for sky.
  #
  # It checks two things at once that the shaded view cannot separate: that the
  # split distances land where ComputeShadowCascades says (the bands are visible
  # and their boundaries measurable) and that the shadow shapes inside each band
  # are the ones the traced reference draws.
  #
  # A single flat colour here means cascade selection collapsed -- every surface
  # landing in cascade 0 renders as plausible shadows with a quarter of the
  # resolution the far distance needs, and nothing else in the suite would say so.
  - name: shadow-cascades
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 7
    frames: 2

  # ---- Soft shadows (Phase 8c) ---------------------------------------------

  # PENUMBRA WIDTH, which is the only thing this fixture is for. Three casters at
  # three heights above the ground under one wide point light: a penumbra widens
  # with caster-to-receiver distance, so the three shadows must be visibly
  # different softnesses. A fixture with everything at one height would test the
  # tap pattern and nothing about whether the penumbra scales.
  #
  # The tap pattern is a DETERMINISTIC golden-angle spiral, not a random one, so
  # the raster path and the reference produce identical visibility fractions
  # rather than converging to the same answer from different amounts of noise.
  # That is what makes these two comparable at four frames instead of hundreds.
  - name: softshadow-pbr
    project: tests/scenes/softshadows/softshadows.lrproj
    shader: pbr
    width: 640
    height: 360
    frames: 4

  - name: softshadow-forward
    project: tests/scenes/softshadows/softshadows.lrproj
    shader: forward
    width: 640
    height: 360
    frames: 4

  # ---- Bloom (Phase 11) -----------------------------------------------------

  # THE ONLY SCENARIO WITH BLOOM ON. It is a post-process and every other
  # forward-vs-reference comparison here is a SHADING comparison -- the compute
  # renderers tonemap internally so a pre-tonemap bloom cannot exist in their
  # path, and leaving it on everywhere would make forward differ from pbr by the
  # bloom term and quietly weaken the gate that says the rasterizer shades right.
  #
  # The lights fixture has a spot light throwing a bright pool on the ground,
  # which is the brightest thing in any fixture and the only place a threshold of
  # 1.0 in LINEAR radiance actually trips.
  - name: bloom-forward
    project: tests/scenes/lights/lights.lrproj
    shader: forward
    width: 640
    height: 360
    frames: 4
    bloom: true

  # ---- TAA (Phase 11) -------------------------------------------------------

  # THE ONLY SCENARIO WITH TAA ON, and it pans the camera so the resolve has
  # something to reproject. A static camera converges TAA to the un-jittered
  # image and would test the blend but nothing about history rejection -- which
  # is the entire difficulty and the only part that produces artefacts.
  #
  # 12 frames: long enough for the 0.9 history weight to converge visibly, short
  # enough that a ghosting regression is still a large fraction of the image.
  #
  # What a failure looks like: a smear trailing each object means the
  # neighbourhood clamp stopped rejecting bad history; a frame that swims by a
  # fraction of a pixel means the jitter leaked into the velocity buffer.
  - name: taa-pan
    project: tests/scenes/lights/lights.lrproj
    shader: forward
    width: 640
    height: 360
    frames: 12
    cameraPanX: 0.06
    taa: true

  # ---- DDGI (Phase 10) ------------------------------------------------------

  # PROBE-BASED INDIRECT LIGHT. The only scenario with it on: the compute
  # reference has no probe GI, so leaving it enabled would make every
  # forward-vs-pbr comparison differ by the indirect term.
  #
  # 24 frames, because the probes converge over time -- one bounce per frame,
  # hysteresis 0.97. A scenario short enough to catch them mid-convergence would
  # still be deterministic but would measure the warm-up rather than the result.
  #
  # What a failure looks like: light bleeding through the ground plane into the
  # shadowed side of an object is a Chebyshev visibility failure; flickering
  # between runs is the fp32 depth atlas having been made fp16; a scene that
  # brightens frame over frame is energyPreservation at or above 1.
  - name: ddgi-lights
    project: tests/scenes/lights/lights.lrproj
    shader: forward
    width: 640
    height: 360
    frames: 24
    ddgi: true

  # THE LIGHT-LEAK TEST ENGINE_PLAN.md asks for by name: "leaking is the classic
  # DDGI failure and will not be obvious from one screenshot".
  #
  # A SEALED BOX with the camera inside, under a strong sun outside. No light path
  # into the interior exists, so the correct image is BLACK and the test is one
  # number: mean interior brightness. leaktest-reference is the ground truth,
  # path traced at four bounces.
  #
  # It FOUND A REAL ENGINE BUG, not just a DDGI tuning problem. Measured means,
  # out of 255, against a ground truth of 0.00:
  #
  #   before                         128.10
  #   after two-sided probe tracing   51.40
  #   after 8 probe levels             1.77
  #
  # IntersectTri culls back faces, which is right for camera and shadow rays and
  # wrong for a ray starting inside geometry: such a ray sees only back faces and
  # so passes straight through the solid it is buried in and out to the sky. Every
  # probe inside a wall filled with skybox radiance. It also made Ray::frontFacing
  # dead code -- it is computed after traversal, and with back faces culled the
  # test can only ever be true. g_TwoSidedTrace, off by default, fixes it for the
  # one caller that needs it.
  #
  # The rest was probe placement: a four-level grid over a 13-unit auto-fitted
  # volume gave 4.3 units of spacing, so a 3-unit-tall room contained NO PROBES AT
  # ALL and every interior lookup interpolated probes buried in the floor and
  # ceiling.
  #
  # The residual 1.77 is not zero and the golden records it as the current state,
  # not as correct. AmbientIBL is still unoccluded everywhere DDGI is off.
  - name: leaktest-reference
    project: tests/scenes/leaktest/leaktest.lrproj
    shader: pathtracing
    width: 640
    height: 360
    raysPerPixel: 2
    bouncesPerRay: 4
    accumulate: true
    frames: 32

  - name: ddgi-leaktest
    project: tests/scenes/leaktest/leaktest.lrproj
    shader: forward
    width: 640
    height: 360
    frames: 24
    ddgi: true

  - name: ddgi-atlas
    project: tests/scenes/leaktest/leaktest.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 8
    frames: 24
    ddgi: true

  # ---- Depth of field and motion blur (Phase 11) ----------------------------

  # DEPTH OF FIELD. Focus is set to the cube's distance, so the sphere in front
  # and the cylinder behind should both blur while the cube stays sharp -- a
  # scenario focused on nothing in particular would blur everything uniformly
  # and could not tell a working CoC from a constant one.
  - name: dof-lights
    project: tests/scenes/lights/lights.lrproj
    shader: forward
    width: 640
    height: 360
    frames: 4
    dof: true

  # MOTION BLUR, which needs motion to test at all -- a static camera produces
  # zero velocity and the effect is a no-op that would pass whatever it did.
  # cameraPanX gives it something to smear.
  - name: motionblur-pan
    project: tests/scenes/lights/lights.lrproj
    shader: forward
    width: 640
    height: 360
    frames: 6
    cameraPanX: 0.12
    motionBlur: true
