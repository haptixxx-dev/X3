# Render test scenarios. One golden image per entry, in tests/golden/<name>.png.
#
# EVERY FIELD HERE EXISTS TO MAKE THE OUTPUT REPRODUCIBLE. Frame counts are
# fixed rather than time- or convergence-based, the scene camera is always used
# (the editor camera starts at the origin looking at empty sky), and vSync is
# forced off, so the same commit produces the same bytes on any machine fast
# enough to finish.
#
# Resolution is deliberately small: these are regression images, not wallpapers,
# and they live in git.
#
#   name           output/golden filename stem
#   project        path to a .lrproj, relative to the repo root
#   shader         pathtracing | pbr | phong
#   frames         how many frames to render before reading back
#   accumulate     path tracer only -- with `frames`, sets the sample count
#   debugMode      0 = shaded, 1 = AABB heatmap, 2 = triangle heatmap

scenarios:
  # The reference renderer. 32 accumulated frames x 2 spp is enough for the
  # noise floor to settle below the comparison tolerance without the run taking
  # long enough to be annoying.
  - name: bunny-pathtracing
    project: TestProject/TestProject.lrproj
    shader: pathtracing
    width: 640
    height: 360
    raysPerPixel: 2
    bouncesPerRay: 4
    accumulate: true
    frames: 32

  # Single-sample, no accumulation: catches material and texture regressions
  # without any noise at all, so a failure here is unambiguous.
  - name: bunny-phong
    project: TestProject/TestProject.lrproj
    shader: phong
    width: 640
    height: 360
    frames: 4

  - name: bunny-pbr
    project: TestProject/TestProject.lrproj
    shader: pbr
    width: 640
    height: 360
    frames: 4

  # Geometry and BVH coverage, independent of shading: if the mesh format or the
  # accelerator regresses, this moves even when the shaded images do not.
  - name: bunny-aabb-heatmap
    project: TestProject/TestProject.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 1
    frames: 2

  - name: bunny-tri-heatmap
    project: TestProject/TestProject.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 2
    frames: 2

  # NUMERIC BSDF VALIDATION, not a picture. Ignores the scene entirely and
  # writes a table of directional albedos: x is roughness, y is view angle,
  # R = metal, G = dielectric. `energyTest` runs the white-furnace assertions on
  # the FLOAT output before the image is quantised, because an 8-bit encode
  # clamps at 1.0 and would hide the one failure that actually matters.
  #
  # frames: 1 -- the shader is a closed-form integration, not an accumulation.
  - name: bsdf-furnace
    project: TestProject/TestProject.lrproj
    shader: furnace
    width: 128
    height: 64
    frames: 1
    energyTest: true

  # ---- Primitive-only fixtures (generated by X3FixtureGen --fixture) --------
  # These depend on NOTHING in SampleModels, so they work on any checkout. They
  # are the per-pass gates Phase 7 gets validated against, and a gate that needs
  # an asset someone forgot to fetch is not a gate.
  #
  # Regenerate with:
  #   ./build/debug/Debug/X3FixtureGen --fixture materials --out tests/scenes/materials --force
  #   ./build/debug/Debug/X3FixtureGen --fixture lights    --out tests/scenes/lights    --force

  # 5x5 sphere grid: metal / dielectric / clearcoat / sheen / anisotropy, each
  # row sweeping its parameter. Rows are separated so a regression in one lobe
  # moves one row and leaves the others alone -- which is what makes the diff
  # diagnostic rather than merely red.
  - name: materials-pathtracing
    project: tests/scenes/materials/materials.lrproj
    shader: pathtracing
    width: 640
    height: 360
    raysPerPixel: 2
    bouncesPerRay: 3
    accumulate: true
    frames: 24

  - name: materials-pbr
    project: tests/scenes/materials/materials.lrproj
    shader: pbr
    width: 640
    height: 360
    frames: 4

  # One object per light type, spatially separated, each with its own shadow.
  # Phase 8 replaces the shadow path entirely; this is what will say whether the
  # replacement agrees with the tracer.
  - name: lights-pathtracing
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    raysPerPixel: 2
    bouncesPerRay: 3
    accumulate: true
    frames: 24

  - name: lights-pbr
    project: tests/scenes/lights/lights.lrproj
    shader: pbr
    width: 640
    height: 360
    frames: 4

  # THE DEPTH PREPASS'S OUTPUT -- the gate on Phase 7's rasterizer.
  #
  # Reverse-Z shown logarithmically: bright is near, black is the far plane and
  # empty sky. The raw value is useless to look at -- an object eight units away
  # sits at near/8 = 0.006, one or two levels out of 255, which reads as a black
  # frame and is indistinguishable from a prepass that drew nothing.
  #
  # THIS AND lights-pathtracing FRAME THE SAME SCENE, which is what makes the
  # rasterizer checkable against the reference rather than against an opinion.
  # When the golden was recorded, the ground horizon landed on row 120 in both
  # and the cube's silhouette edges on columns 267 and 371 in both. If this ever
  # goes red, compare the two directly before changing anything.
  - name: depth-prepass
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 3
    frames: 2

  # ---- Clustered Forward+ light culling (Phase 7b) --------------------------

  # LIGHTS PER CLUSTER, as a heatmap over the primary hit. A performance view,
  # not a correctness one: it says how much work the forward pass will do per
  # pixel, and it moves if the grid shape or the depth slicing changes.
  - name: cluster-heatmap
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 4
    frames: 2

  # CULLING CORRECTNESS, and this one is an assertion rather than a picture.
  #
  # For every visible point it asks: does this point's cluster list contain every
  # light that actually reaches it, under the SAME predicate SampleLightDirect
  # uses? Green yes, RED NO, blue for a visible surface that maps to no cluster.
  #
  # ANY RED IS A BUG. The golden contains none, so a regression that starts
  # dropping lights fails here loudly instead of showing up later as geometry
  # that is merely a bit too dark -- which is what a light-culling bug looks like
  # and is close to impossible to spot by eye.
  #
  # Over-inclusion is deliberately NOT an error: the cluster test is a sphere, so
  # a spot light whose cone misses the point is still listed. That costs a little
  # work and cannot change the image.
  - name: cluster-correctness
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 5
    frames: 2

  # ---- Clustered forward shading (Phase 7c) --------------------------------

  # THE RASTERIZER, SHADING. Depth prepass -> cluster build -> light cull ->
  # skybox fill -> forward opaque, with the compute path skipped entirely.
  #
  # ITS GATE IS lights-pbr, NOT ITS OWN GOLDEN. Both are single-sample direct
  # lighting plus the same ambient term over the same scene, and since Phase 6
  # both evaluate the same Bsdf.slang lobes and the same SampleLightDirect. The
  # only thing the forward pass does differently is take its light list from the
  # fragment's cluster instead of iterating every light -- so a disagreement
  # between these two images is a light-culling bug and very little else.
  #
  # That comparison is why SkyboxFill exists: without a background the two could
  # only be compared over a geometry mask, which is a weaker test.
  - name: forward-lights
    project: tests/scenes/lights/lights.lrproj
    shader: forward
    width: 640
    height: 360
    frames: 4

  - name: forward-materials
    project: tests/scenes/materials/materials.lrproj
    shader: forward
    width: 640
    height: 360
    frames: 4

  # ---- Velocity buffer (Phase 7d) ------------------------------------------

  # SCREEN-SPACE MOTION VECTORS, under actual motion.
  #
  # cameraPanX moves the scene camera a fixed step along world X between frames,
  # which is the only reason this test says anything. Every other scenario is a
  # static scene viewed by a static camera, and correct motion vectors for that
  # are identically zero -- a golden recorded that way passes whether the pass
  # computes motion or writes nothing at all.
  #
  # Red is rightward motion, green downward, mid-grey no motion. Amplified 20x
  # because velocity is in UV units: a whole pixel of motion at 640 wide is
  # 0.0016, which shown raw is a black frame and indistinguishable from a pass
  # that never ran. That is the same trap the depth view fell into.
  #
  # The sky has no geometry and therefore no velocity, so it stays exactly at
  # the clear value. That is correct and deliberate: camera-only reprojection
  # from depth is Phase 11's problem, and a velocity buffer that guessed at it
  # here would be wrong for anything that moved on its own.
  - name: velocity-pan
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 6
    frames: 4
    cameraPanX: 0.25

  # The same pass with the camera STATIONARY. Correct output is a flat mid-grey
  # everywhere geometry is: zero motion, biased to 0.5. It is a weaker test than
  # the pan above and it catches a different failure -- a velocity buffer that
  # reports motion for a scene that is not moving, which is what a stale or
  # wrongly-indexed PrevTransformBuffer produces and what TAA smears worst.
  - name: velocity-static
    project: tests/scenes/lights/lights.lrproj
    shader: pathtracing
    width: 640
    height: 360
    debugMode: 6
    frames: 4
